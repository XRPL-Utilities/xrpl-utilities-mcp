name: Contract scrub

# Daily integration check across the XR-* portfolio. Catches the class of
# bug where an MCP tool definition or a cross-service consumer hard-codes
# a field name that the producer has renamed, removed, or silently dropped.
#
# Runs:
#   - Daily at 08:00 UTC (cron)
#   - On manual dispatch
#   - On any push that touches the tool defs or the scrubber itself
#
# On failure opens a GitHub Issue tagged `contract-drift`. Idempotent: if
# an open drift issue already exists the workflow appends a new comment
# instead of opening a duplicate.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/services/**"
      - "scripts/contract_scrub.mjs"
      - ".github/workflows/contract-scrub.yml"

jobs:
  scrub:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # auto-fix path pushes a branch
      issues: write         # drift-found path opens / comments on the contract-drift Issue
      pull-requests: write  # auto-fix path runs `gh pr create`
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Run scrubber (with auto-fix)
        id: scrub
        run: |
          set +e
          # Exit codes:
          #   0 = all PASS
          #   1 = drift found, none auto-fixable
          #   2 = drift found, schema-version fixes applied to working tree
          node scripts/contract_scrub.mjs --auto-fix > scrub.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT
          cat scrub.log
      - name: Open auto-fix PR (schema-version sync)
        if: steps.scrub.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-fix/schema-sync-$(date -u +%Y%m%d)"
          # If a branch from an earlier run today already exists, force-update it
          git checkout -B "$BRANCH"
          git add src/services/
          # Build the commit message in a file so the multi-line body stays
          # inside the YAML block scalar (embedding raw newlines in -m "..."
          # dedents out of the block and breaks workflow parsing).
          {
            echo "fix: auto-sync knownSchemaVersions with live backends"
            echo
            echo "Scrubber detected one or more backend schema_versions not yet listed in"
            echo "the MCP service's knownSchemaVersions array. Live value is canonical;"
            echo "this is a mechanical append."
            echo
            cat .auto-fix-summary.txt
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push --force origin "$BRANCH"
          # Open PR (or no-op if one already exists from today)
          {
            echo "Mechanical fix from the daily contract scrubber. Review + merge to clear the drift."
            echo
            cat .auto-fix-summary.txt
            echo
            echo "_Auto-generated; safe to merge if the live backends are the canonical source of truth._"
          } > /tmp/pr-body.txt
          gh pr create \
            --title "auto-fix: schema-version sync" \
            --body-file /tmp/pr-body.txt \
            --base main \
            --head "$BRANCH" || echo "PR already exists for $BRANCH"
      - name: Open / update drift issue on failure
        if: steps.scrub.outputs.exit == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = "```\n" + fs.readFileSync('scrub.log', 'utf8').slice(-12000) + "\n```";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contract-drift',
              per_page: 5,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Drift still present on ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Contract drift detected (${new Date().toISOString().slice(0,10)})`,
                labels: ['contract-drift'],
                body: `Daily scrubber failed. Recent log:\n\n${body}\n\n_Re-run will append a comment; close this issue when fixed and the next clean run won't reopen it._`,
              });
            }
      - name: Fail the job on un-fixable drift
        if: steps.scrub.outputs.exit == '1'
        run: exit 1
