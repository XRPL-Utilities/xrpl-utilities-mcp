name: Contract scrub

# Daily integration check across the XR-* portfolio. Catches the class of
# bug where an MCP tool definition or a cross-service consumer hard-codes
# a field name that the producer has renamed, removed, or silently dropped.
#
# Runs:
#   - Daily at 08:00 UTC (cron)
#   - On manual dispatch
#   - On any push that touches the tool defs or the scrubber itself
#
# On failure opens a GitHub Issue tagged `contract-drift`. Idempotent: if
# an open drift issue already exists the workflow appends a new comment
# instead of opening a duplicate.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/services/**"
      - "scripts/contract_scrub.mjs"
      - ".github/workflows/contract-scrub.yml"

jobs:
  scrub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Run scrubber
        id: scrub
        run: |
          set +e
          node scripts/contract_scrub.mjs > scrub.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT
          cat scrub.log
      - name: Open / update drift issue on failure
        if: steps.scrub.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = "```\n" + fs.readFileSync('scrub.log', 'utf8').slice(-12000) + "\n```";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contract-drift',
              per_page: 5,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Drift still present on ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Contract drift detected (${new Date().toISOString().slice(0,10)})`,
                labels: ['contract-drift'],
                body: `Daily scrubber failed. Recent log:\n\n${body}\n\n_Re-run will append a comment; close this issue when fixed and the next clean run won't reopen it._`,
              });
            }
      - name: Fail the job on scrub failure
        if: steps.scrub.outputs.exit != '0'
        run: exit 1
