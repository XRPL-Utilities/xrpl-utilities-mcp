name: Release

# Publish to npm whenever a v* tag is pushed. Cuts the release cycle to
# a single command:
#
#   npm version patch       # bumps package.json, creates a v* tag
#   git push --follow-tags  # pushes commit + tag, kicks off this workflow
#
# Auth via the NPM_TOKEN repository secret (granular publish-only token,
# scoped to @xrpl-utilities). Once we move to OIDC trusted-publisher
# (post first-publish), we can drop NODE_AUTH_TOKEN and let npm trust
# the workflow identity directly.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write enables two things:
      #   1. npm provenance (sigstore-signed proof that this exact artifact
      #      was built from this repo at this commit by GitHub Actions).
      #   2. GitHub OIDC auth for the MCP Registry publisher.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        # Hermetic: no network. Keeps the guards in tests/ from rotting
        # silently between releases.
        run: npm test

      - name: Verify package.json version matches the tag
        # Belt-and-braces: refuse to publish if someone tags v0.2.0 but
        # forgot to bump package.json from 0.1.2. npm would reject the
        # mismatched version anyway, but the error message is opaque.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version check OK: $PKG_VERSION"

      - name: Configure npm auth
        # Write the registry credential explicitly. setup-node's
        # registry-url integration wasn't picking up NODE_AUTH_TOKEN
        # in our first run (ENEEDAUTH at publish time). The explicit
        # .npmrc write is the canonical fallback that always works.
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty - check repository secrets"
            exit 1
          fi
          echo "npm token length: ${#NPM_TOKEN} chars (expecting 40+)"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Sync server.json version to tag
        # mcp-publisher cross-verifies that the version in server.json
        # matches the version in the published npm package. Rather than
        # editing server.json on every release, regenerate the version
        # fields from the tag right before publishing to the registry.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<PY
          import json
          p = "server.json"
          d = json.load(open(p))
          d["version"] = "$TAG_VERSION"
          for pkg in d.get("packages", []):
              pkg["version"] = "$TAG_VERSION"
          json.dump(d, open(p, "w"), indent=2)
          PY
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin mcp-publisher
          mcp-publisher --help | head -1

      - name: Publish to MCP Registry
        # GitHub OIDC auth: registry verifies the workflow's id-token
        # claim against the io.github.XRPL-Utilities/* namespace.
        # No PAT or secret required.
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
